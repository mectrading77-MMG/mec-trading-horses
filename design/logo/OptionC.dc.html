<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
    body{margin:0;background:#F7F2E7;color:#17140F;font-family:'IBM Plex Mono','Consolas','Courier New',monospace;-webkit-font-smoothing:antialiased}
    a{color:#B08D57}a:hover{color:#C7A468}
    .display{font-family:'Fraunces',Georgia,'Times New Roman',serif}
    .lab{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(23,20,15,.4)}
    .lab-d{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,242,231,.35)}
  </style>
</helmet>
<div style="display:flex;height:720px;background:#F7F2E7">

  <!-- Reversed -->
  <div style="flex:1;background:#17140F;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px">
    <span class="lab-d" style="position:absolute;top:24px;left:28px">Horseshoe — reversed</span>
    <div style="width:190px;color:#C7A468">
      <svg viewBox="0 0 110 104" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <path d="M32 92 C18 76 12 56 15 40 C19 20 37 8 55 8 C73 8 91 20 95 40 C98 56 92 76 78 92 L68 88 C80 74 85 58 82 44 C79 27 66 18 55 18 C44 18 31 27 28 44 C25 58 30 74 42 88 Z"></path>
        <circle cx="21.5" cy="50" r="1.8" fill="currentColor" stroke="none"></circle>
        <circle cx="25" cy="33" r="1.8" fill="currentColor" stroke="none"></circle>
        <circle cx="38" cy="19" r="1.8" fill="currentColor" stroke="none"></circle>
        <circle cx="88.5" cy="50" r="1.8" fill="currentColor" stroke="none"></circle>
        <circle cx="85" cy="33" r="1.8" fill="currentColor" stroke="none"></circle>
        <circle cx="72" cy="19" r="1.8" fill="currentColor" stroke="none"></circle>
        <path d="M55 78 L57.5 84 L63 86.5 L57.5 89 L55 95 L52.5 89 L47 86.5 L52.5 84 Z" fill="currentColor" stroke="none"></path>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
      <span class="display" style="font-style:italic;font-weight:500;font-size:44px;line-height:1;letter-spacing:-.01em;color:#F7F2E7">MEC</span>
      <span style="font-size:9px;letter-spacing:.5em;text-transform:uppercase;color:#B08D57;text-indent:.5em">Trading</span>
    </div>
  </div>

  <!-- On ivory -->
  <div style="flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;border-left:1px solid rgba(23,20,15,.12)">
    <span class="lab" style="position:absolute;top:24px;left:28px">On ivory · small sizes</span>
    <div style="display:flex;align-items:center;gap:20px">
      <div style="width:72px;color:#B08D57;flex:none">
        <svg viewBox="0 0 110 104" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
          <path d="M32 92 C18 76 12 56 15 40 C19 20 37 8 55 8 C73 8 91 20 95 40 C98 56 92 76 78 92 L68 88 C80 74 85 58 82 44 C79 27 66 18 55 18 C44 18 31 27 28 44 C25 58 30 74 42 88 Z"></path>
          <circle cx="21.5" cy="50" r="1.8" fill="currentColor" stroke="none"></circle>
          <circle cx="25" cy="33" r="1.8" fill="currentColor" stroke="none"></circle>
          <circle cx="38" cy="19" r="1.8" fill="currentColor" stroke="none"></circle>
          <circle cx="88.5" cy="50" r="1.8" fill="currentColor" stroke="none"></circle>
          <circle cx="85" cy="33" r="1.8" fill="currentColor" stroke="none"></circle>
          <circle cx="72" cy="19" r="1.8" fill="currentColor" stroke="none"></circle>
          <path d="M55 78 L57.5 84 L63 86.5 L57.5 89 L55 95 L52.5 89 L47 86.5 L52.5 84 Z" fill="currentColor" stroke="none"></path>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="display" style="font-style:italic;font-weight:500;font-size:32px;line-height:1;color:#17140F">MEC</span>
        <span style="font-size:7px;letter-spacing:.45em;text-transform:uppercase;color:#B08D57;text-indent:.45em">Trading</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:36px">
      <div style="width:36px;color:#B08D57">
        <svg viewBox="0 0 110 104" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round">
          <path d="M32 92 C18 76 12 56 15 40 C19 20 37 8 55 8 C73 8 91 20 95 40 C98 56 92 76 78 92 L68 88 C80 74 85 58 82 44 C79 27 66 18 55 18 C44 18 31 27 28 44 C25 58 30 74 42 88 Z"></path>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="width:40px;height:40px;background:#17140F;display:flex;align-items:center;justify-content:center">
          <div style="width:26px;color:#C7A468">
            <svg viewBox="0 0 110 104" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
              <path d="M32 92 C18 76 12 56 15 40 C19 20 37 8 55 8 C73 8 91 20 95 40 C98 56 92 76 78 92 L68 88 C80 74 85 58 82 44 C79 27 66 18 55 18 C44 18 31 27 28 44 C25 58 30 74 42 88 Z"></path>
            </svg>
          </div>
        </div>
        <span class="lab">Favicon</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
