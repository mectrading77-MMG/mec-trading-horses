<!doctype html>

<x-dc>

</helmet>

          <span class="display" style="font-style:italic;font-weight:500;font-size:36px;line-height:1;color:#17140F">MEC</span>
          <span style="font-size:8px;letter-spacing:.45em;text-transform:uppercase;color:#B08D57;text-indent:.45em">Trading</span>
        </div>
      </div>
      <span class="lab">Horizontal</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;border-right:1px solid rgba(23,20,15,.12)">

          <span style="font-size:8px;letter-spacing:.45em;text-transform:uppercase;color:#B08D57;text-indent:.45em">Trading</span>
        </div>
      </div>
      <span class="lab">Stacked</span>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">
      <div style="width:120px;color:#B08D57">
        <svg viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1.5"></circle>

    <span class="lab" style="position:absolute;top:24px;left:28px">Scale — use mark only below 40px</span>
    <div style="width:96px;color:#B08D57">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="1.5"></circle>

        <g clip-path="url(#rce)"><path transform="translate(60 62) scale(0.56) translate(-114 -106)" fill="currentColor" fill-rule="evenodd" d="M104 16 C102 20 100 26 98 32 C97 35 95 38 94 40 C86 50 77 61 70 72 C66 78 62 84 60 90 C57 95 53 98 52 102 C51 106 53 110 56 112 C58 113 61 114 64 114 C71 112 78 110 84 108 C79 114 75 120 72 126 C73 129 76 131 80 131 C86 131 91 128 94 125 C100 128 104 131 106 134 C102 146 97 158 95 170 C94 180 95 190 96 200 L176 200 C175 184 173 166 170 148 C167 130 162 110 156 92 C152 78 148 64 144 52 C143 46 141 41 138 38 C137 28 134 18 130 10 C128 17 127 23 126 29 C125 31 124 32 123 33 C120 31 116 30 112 30 C110 25 107 20 104 16 Z M94 54 C97 51 101 51 103 55 C100 57 96 57 94 54 Z M57 96 C59 94 61 95 61 98 C59 99 57 98 57 96 Z"></path></g>
