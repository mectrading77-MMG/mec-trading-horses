name: Apply database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mec-horses-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mec-trading-horses/mec-trading
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mec-trading-horses/mec-trading/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate database secret format
        shell: bash
        env:
          RAW_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          value="$RAW_DATABASE_URL"
          value="${value#\"}"
          value="${value%\"}"
          value="${value#\'}"
          value="${value%\'}"
          if [[ "$value" =~ ^postgres(ql)?:// ]]; then
            echo "DATABASE_URL format is valid."
            echo "DATABASE_URL=$value" >> "$GITHUB_ENV"
          else
            echo "::error::DATABASE_URL secret is present but does not start with postgresql:// or postgres:// after removing surrounding quotes. Update the GitHub secret with the raw PostgreSQL connection URL only."
            exit 1
          fi

      - name: Apply pending migrations
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma
